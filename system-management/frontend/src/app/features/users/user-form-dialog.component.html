<h2 mat-dialog-title>{{ isEdit ? 'Edit user' : 'Create user' }}</h2>

<mat-dialog-content>
  <div class="dialog-form">
    <div class="row g-3">
      @if (!isEdit) {
        <div class="col-md-6">
          <app-field
            label="Email address"
            type="email"
            [value]="email.value()"
            [touched]="email.touched()"
            [error]="email.error()"
            autocomplete="email"
            (valueChange)="email.value.set($event)"
            (blur)="email.touched.set(true)" />
        </div>
        <div class="col-md-6">
          <app-field
            label="Password"
            type="password"
            [value]="password.value()"
            [touched]="password.touched()"
            [error]="password.error()"
            autocomplete="new-password"
            (valueChange)="password.value.set($event)"
            (blur)="password.touched.set(true)" />
        </div>
      }

      <div class="col-12">
        <app-field
          label="Full name"
          [value]="fullName.value()"
          [touched]="fullName.touched()"
          [error]="fullName.error()"
          (valueChange)="fullName.value.set($event)"
          (blur)="fullName.touched.set(true)" />
      </div>

      <div class="col-12">
        <label class="form-label fw-medium">Role</label>
        <button type="button" class="role-trigger" #roleTriggerBtn
                [matMenuTriggerFor]="roleMenu" (menuOpened)="onRoleMenuOpened()">
          <span class="role-chip role-{{ globalRole().toLowerCase() }}">
            {{ globalRole() }}
          </span>
          <mat-icon class="trigger-caret">expand_more</mat-icon>
        </button>
        <mat-menu #roleMenu="matMenu" class="role-menu">
          <button mat-menu-item (click)="globalRole.set('ADMIN')">
            <span class="role-chip role-admin">ADMIN</span>
          </button>
          <button mat-menu-item (click)="globalRole.set('EDITOR')">
            <span class="role-chip role-editor">EDITOR</span>
          </button>
          <button mat-menu-item (click)="globalRole.set('VIEWER')">
            <span class="role-chip role-viewer">VIEWER</span>
          </button>
        </mat-menu>
      </div>

      @if (isEdit) {
        <div class="col-12">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch"
                   id="isActiveSwitch"
                   [checked]="isActive()"
                   (change)="isActive.set($any($event.target).checked)" />
            <label class="form-check-label" for="isActiveSwitch">Active account</label>
          </div>
        </div>
      }
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="loading()">
    {{ isEdit ? 'Save changes' : 'Create user' }}
  </button>
</mat-dialog-actions>
