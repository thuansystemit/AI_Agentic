spring:
  application:
    name: video-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:videoplatform}
    username: ${DB_USERNAME:videoplatform}
    password: ${DB_PASSWORD:videoplatform}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # existing DB has no flyway_schema_history — baseline it
    baseline-version: 2         # marks V1+V2 as already applied; only V3+ will run

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB

server:
  port: ${SERVER_PORT:8080}

# Application-specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-that-must-be-changed-in-production-min-256-bits-long}
    expiration-ms: ${JWT_EXPIRATION:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

  storage:
    upload-dir: ${UPLOAD_DIR:./uploads/videos}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

  cookie:
    secure: ${COOKIE_SECURE:false}
