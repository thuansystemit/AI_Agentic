<a [routerLink]="['/videos', video.id]" class="video-card">
  <div class="video-thumbnail">
    <div class="play-icon">&#9654;</div>
    <span class="video-size">{{ formatFileSize(video.fileSize) }}</span>
  </div>
  <div class="video-info">
    <h3 class="video-title">{{ video.title }}</h3>
    <p class="video-meta">
      <span class="video-owner">{{ video.owner.username }}</span>
      <span class="video-date">{{ formatDate(video.createdAt) }}</span>
    </p>
  </div>
</a>
