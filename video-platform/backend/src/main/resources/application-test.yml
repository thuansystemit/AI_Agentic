spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-must-be-at-least-256-bits-long-for-hs256
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  storage:
    upload-dir: ./test-uploads
