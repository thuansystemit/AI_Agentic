<div class="app-field">
  <label [for]="fieldId" class="form-label">{{ label() }}</label>

  @if (type() === 'textarea') {
    <textarea [id]="fieldId" class="form-control"
              [class.is-invalid]="hasError()"
              [rows]="rows()"
              [value]="value()"
              [placeholder]="placeholder()"
              [attr.autocomplete]="autocomplete() || null"
              [disabled]="disabled()"
              (input)="onInput($event)"
              (blur)="onBlur()"></textarea>
  } @else {
    <div class="input-group">
      @if (prefixIcon()) {
        <span class="input-group-text">
          <mat-icon class="field-icon">{{ prefixIcon() }}</mat-icon>
        </span>
      }
      <input [id]="fieldId" class="form-control"
             [class.is-invalid]="hasError()"
             [type]="inputType()"
             [value]="value()"
             [placeholder]="placeholder()"
             [attr.autocomplete]="autocomplete() || null"
             [disabled]="disabled()"
             (input)="onInput($event)"
             (blur)="onBlur()" />
      @if (type() === 'password') {
        <button class="btn btn-outline-secondary" type="button" tabindex="-1"
                [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                (click)="showPassword.update(v => !v)">
          <mat-icon class="field-icon">{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      }
    </div>
  }

  @if (hasError()) {
    <div class="invalid-feedback d-block">{{ error() }}</div>
  }

  @if (hint()) {
    <div class="form-text">{{ hint() }}</div>
  }
</div>
