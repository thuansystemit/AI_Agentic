<h2 mat-dialog-title>Reset password — {{ user.fullName }}</h2>

<mat-dialog-content>
  <p class="hint-text">The user will be signed out of all devices and must log in with the new password.</p>

  <div class="dialog-form">
    <div class="row g-3">
      <div class="col-12">
        <app-field
          label="New password"
          type="password"
          [value]="newPassword.value()"
          [touched]="newPassword.touched()"
          [error]="newPassword.error()"
          autocomplete="new-password"
          (valueChange)="newPassword.value.set($event)"
          (blur)="newPassword.touched.set(true)" />
      </div>

      <div class="col-12">
        <app-field
          label="Confirm new password"
          type="password"
          [value]="confirmPassword.value()"
          [touched]="confirmPassword.touched()"
          [error]="confirmError()"
          autocomplete="new-password"
          (valueChange)="confirmPassword.value.set($event)"
          (blur)="confirmPassword.touched.set(true)" />
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="warn" (click)="save()" [disabled]="loading()">
    Reset password
  </button>
</mat-dialog-actions>
